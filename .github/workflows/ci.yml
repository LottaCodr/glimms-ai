name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [object_detection, attribute_extractor, embedding_engine,
                  permutation_engine, llm_reasoning, mockup_compositor,
                  quality_guard, context_inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: pip install pytest httpx
      - run: python -c "import sys; sys.path.insert(0,'.'); from services.${{ matrix.service }}.app.main import app; print('Import OK')"
