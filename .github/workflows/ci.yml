name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  import:
    name: Import ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [object_detection, attribute_extractor, embedding_engine,
                  permutation_engine, llm_reasoning, mockup_compositor,
                  quality_guard, context_inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - run: python -m compileall -q services/${{ matrix.service }} shared
      - run: python -c "from services.${{ matrix.service }}.app.main import app; print(app.title)"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: PYTHONPATH=. python -m pytest -q
